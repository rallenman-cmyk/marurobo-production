<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>台本レビュー まるロボ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --bg: #f4f6fb; --card: #ffffff; --ink: #1b2440; --sub: #5a6585; --line: #d8deec;
  --navy: #232f68; --yellow: #ffd640; --anko: #2f7fd8; --capy: #b07a45; --ok: #1f8a4c; --warn: #c2410c; --open: #b42318;
  --bn-bg: #fff4d6; --bn-ink: #5a3b00; --bn-line: #f0c95a;
  --tap: 44px; --gut-l: max(16px, env(safe-area-inset-left)); --gut-r: max(16px, env(safe-area-inset-right));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #121625; --card: #1c2236; --ink: #e8ecf8; --sub: #a3acc6; --line: #2e3652;
    --anko: #5aa2f0; --capy: #d29a63; --ok: #4cc27f; --warn: #f28a4b; --open: #f2706a;
    --bn-bg: #3a2f10; --bn-ink: #ffe7a6; --bn-line: #7a6320; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #121625; --card: #1c2236; --ink: #e8ecf8; --sub: #a3acc6; --line: #2e3652;
  --anko: #5aa2f0; --capy: #d29a63; --ok: #4cc27f; --warn: #f28a4b; --open: #f2706a;
  --bn-bg: #3a2f10; --bn-ink: #ffe7a6; --bn-line: #7a6320; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 16px; line-height: 1.6;
  overflow-wrap: anywhere; -webkit-text-size-adjust: 100%; overflow-x: hidden; }
body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top); background: var(--navy); z-index: 11; }
header#top { position: sticky; top: env(safe-area-inset-top); z-index: 10; background: var(--navy); color: #fff;
  padding: 8px var(--gut-r) 8px var(--gut-l); }
.crumb { font-size: 14px; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
header .row { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
header .row > * { flex: 0 0 auto; }
main { padding: 12px var(--gut-r) 120px var(--gut-l); max-width: 860px; margin: 0 auto; }
button, select, input, textarea { font: inherit; }
button { min-height: var(--tap); min-width: var(--tap); padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); cursor: pointer; }
button.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
button.yellow { background: var(--yellow); color: #222; border-color: #e0b800; }
button:disabled { opacity: .5; }
button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible, .card:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
select { min-height: var(--tap); border-radius: 10px; padding: 6px 10px; background: var(--card); color: var(--ink); border: 1px solid var(--line); max-width: 100%; }
header select { background: #fff; color: #222; }
input[type=search], input[type=text] { min-height: var(--tap); border-radius: 10px; padding: 6px 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
.proj h3 { margin: 0 0 4px; font-size: 17px; }
.meta { color: var(--sub); font-size: 13px; }
.chips { position: sticky; top: calc(env(safe-area-inset-top) + var(--hdr, 92px)); z-index: 5; display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; background: var(--bg); }
.chips button { flex: 0 0 auto; padding: 6px 12px; }
.blk { position: relative; border-left: 6px solid var(--line); cursor: pointer; }
.blk.anko { border-left-color: var(--anko); }
.blk.capy { border-left-color: var(--capy); }
.blk .who { font-weight: 700; font-size: 14px; }
.blk .id { color: var(--sub); font-size: 12px; margin-left: 6px; }
.blk .tags { color: var(--sub); font-size: 12px; }
.blk .text { font-size: 17px; margin-top: 2px; padding-right: 28px; }
.blk .badge { position: absolute; right: 10px; top: 10px; background: var(--open); color: #fff; border-radius: 999px; font-size: 12px; padding: 2px 8px; }
.blk.changed { box-shadow: inset 0 0 0 2px var(--yellow); }
.blk.edited { box-shadow: inset 0 0 0 2px var(--warn); }
.blk .old { text-decoration: line-through; opacity: .55; font-size: .92em; margin-top: 4px; }
.edtag { display: inline-block; font-size: 12px; color: var(--warn); border: 1px solid var(--warn); border-radius: 999px; padding: 0 8px; margin-left: 6px; }
.ctxcard { cursor: pointer; }
.ctx { color: var(--sub); font-size: 14px; white-space: pre-wrap; }
.ctx.folded { max-height: 3.2em; overflow: hidden; }
.chapter { margin: 18px 0 6px; font-size: 18px; font-weight: 800; scroll-margin-top: calc(env(safe-area-inset-top) + var(--hdr, 92px) + 56px); }
.status { display: inline-block; font-size: 12px; border-radius: 6px; padding: 1px 6px; border: 1px solid; }
.status.open { color: var(--open); border-color: var(--open); }
.status.proposed { color: var(--warn); border-color: var(--warn); }
.status.confirmed { color: var(--ok); border-color: var(--ok); }
.banner { background: var(--bn-bg); color: var(--bn-ink); border: 1px solid var(--bn-line); border-radius: 12px; padding: 10px 12px; margin: 8px 0; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line);
  border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.25); max-height: 82vh; overflow: auto;
  padding: 12px var(--gut-r) calc(16px + env(safe-area-inset-bottom)) var(--gut-l); }
.sheet textarea { width: 100%; min-height: 110px; border-radius: 10px; border: 1px solid var(--line); padding: 10px; background: var(--bg); color: var(--ink); }
.sheet .target { font-size: 13px; color: var(--sub); }
.save { font-size: 13px; font-weight: 700; }
.save.draft { color: var(--sub); } .save.unsent { color: var(--warn); } .save.saved { color: var(--ok); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom)); background: #222; color: #fff;
  padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; max-width: 90vw; }
.toast.show { opacity: 1; }
.fixitem { border-top: 1px solid var(--line); padding: 10px 0; }
.fixitem:first-of-type { border-top: 0; }
.fixitem .lbl { font-size: 12px; color: var(--sub); }
.filter { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.empty { color: var(--sub); text-align: center; padding: 30px 0; }
.warn { color: var(--warn); font-weight: 700; }
.ask { border: 1px dashed var(--warn); border-radius: 10px; padding: 8px 10px; margin-top: 6px; }
.hist { font-size: 12px; color: var(--sub); }
/* しおり（2026-10-26 兵藤さん：どこまで読んだか分かるように。読み進めると自動で進む） */
.blk.read .text, .blk.read .tags { opacity: .55; }
.blk.read::after { content: "✓"; position: absolute; right: 12px; bottom: 8px; color: var(--ok); font-weight: 700; font-size: 14px; }
.blk.mark { box-shadow: inset 0 -3px 0 var(--navy); }
.markline { display: none; margin-top: 6px; font-size: 13px; font-weight: 700; color: var(--navy); }
:root[data-theme="dark"] .markline { color: var(--yellow); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .markline { color: var(--yellow); } }
.blk.mark .markline { display: block; }
.chips button.done::after { content: " ✓"; color: var(--ok); }
.resume { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
</style>

<header id="top">
  <div class="crumb" id="crumb">台本レビュー まるロボ</div>
  <div class="row" id="topctl"></div>
</header>
<main id="main"><div class="empty">読み込み中…</div></main>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
// ---- チャンネルごとの設定（kit/make_tool.py が configs/*.json から書き込む。ここ以外はチャンネル共通） ----
const CONFIG = /*CONFIG*/{"title": "台本レビュー まるロボ", "channel": "まるロボ解説チャンネル", "default_project": "MARU-QR", "owner_name": "兵藤さん", "ai_name": "Opus", "speakers": [{"name": "ナレーション", "color": "#1E9C96", "color_dark": "#5fd3cc"}], "theme": {"header": "#14545a", "accent": "#ff9a3c"}}/*END*/;
// 台本レビュー（試用版）：claude.ai の非公開ページ。データはこのページ専用の保存場所（db）。
// 決まり：コメントは版と台詞に固定／送信前は端末に下書き／コメントIDは送信前に決める（押し直しても二重にならない）／自動では送り直さない。
// 確認済み・再修正・最終承認のボタンは、ページの持ち主にだけ出す。Opus はこのページを使わず、決まった手順で新版と修正対応表だけを書く。
const $ = (s, el = document) => el.querySelector(s);
const main = $('#main');
const S = { db: null, user: null, owner: false, project: null, comments: [], reports: [], approvals: {}, vcache: {},
  view: 'projects', vid: null, focus: null, sheet: null };
const STATUS = { open: '未解決', proposed: '修正案提出（未確認）', confirmed: '確認済み' };
const ACT = { fixed: '直した', not_fixed: '直していない', needs_info: '確認が必要' };
let PID = (() => { try { return localStorage.getItem('review:pid') || CONFIG.default_project; } catch (e) { return CONFIG.default_project; } })();   // 2026-10-22：作品を選べるように（ep03 から）
let UNSUB = [];

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function rid() { return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()).replace(/-/g, '').slice(0, 20); }
function nowIso() { return new Date().toISOString(); }
function fmt(t) { if (!t) return ''; const d = new Date(t); return isNaN(d) ? String(t) : d.toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
function errMsg(e) { return e && e.code === 'invalid_argument' ? '書き込みが許可されていません' : (e && e.message) || '保存できませんでした'; }

// ---------------- 話者の色・画面の色（CONFIG から） ----------------
function spClass(sp) { const i = (CONFIG.speakers || []).findIndex(s => s.name === sp); return i < 0 ? '' : 'sp' + i; }
(() => {
  const sp = CONFIG.speakers || [], th = CONFIG.theme || {};
  const light = sp.map((s, i) => `.blk.sp${i}{border-left-color:${s.color}}`).join('');
  const dark = sp.map((s, i) => `.blk.sp${i}{border-left-color:${s.color_dark || s.color}}`).join('');
  if (th.header) document.documentElement.style.setProperty('--navy', th.header);   // 見出しの帯の色
  if (th.accent) document.documentElement.style.setProperty('--yellow', th.accent);  // 変わった台詞の枠・承認ボタンの色
  const st = document.createElement('style');
  st.textContent = `${light}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) ${dark.replace(/}\.blk/g, '} :root:not([data-theme="light"]) .blk')}}:root[data-theme="dark"] ${dark.replace(/}\.blk/g, '} :root[data-theme="dark"] .blk')}`;
  document.head.appendChild(st);
})();

// ---------------- 起動 ----------------
(async () => {
  const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  S.db = db; S.user = user;
  S.owner = user ? await user.isOwner() : false;
  if (!db) { main.innerHTML = '<div class="card"><p class="warn">保存場所に接続できません。</p><p class="meta">claude.ai にログインした状態で開き直してください。</p></div>'; return; }
  const fail = e => { main.innerHTML = `<div class="card"><p class="warn">読み込みに失敗しました（${esc(e.code || '')}）</p><p class="meta">ページを開き直してください。</p></div>`; };
  S.fail = fail;
  db.collection('projects').onSnapshot(s => { S.projects = s.docs.map(d => ({ id: d.id, ...d.data() })); if (S.view === 'projects') render(); }, fail);
  subscribe(PID);
})();

function subscribe(pid) {
  // 作品を切り替えるとき：前の作品の購読をやめ、選んだ作品だけを読む（コメントや承認が混ざらない）
  UNSUB.forEach(u => { try { u && u(); } catch (e) {} });
  PID = pid; S.vid = null; S.vcache = {}; S.comments = []; S.reports = []; S.approvals = {}; S.edits = []; S.project = null; S.marks = {};
  try { localStorage.setItem('review:pid', pid); } catch (e) {}
  const db = S.db, fail = S.fail;
  UNSUB = [
    db.doc('projects/' + pid).onSnapshot(s => { S.project = s.exists ? s.data() : null; render(); }, fail),
    db.collection('comments').where('project', '==', pid).onSnapshot(s => { S.comments = s.docs.map(d => ({ id: d.id, ...d.data() })); render(true); }, fail),
    db.collection('fixreports').where('project', '==', pid).onSnapshot(s => { S.reports = s.docs.map(d => ({ id: d.id, ...d.data() })); render(true); }, fail),
    db.collection('approvals').where('project', '==', pid).onSnapshot(s => { S.approvals = Object.fromEntries(s.docs.map(d => [d.data().version_id, d.data()])); render(true); }, fail),
    // 直接修正（2026-10-22 兵藤さん：自分で文章を直せるように）：edits/<版ID>__<台詞ID>
    db.collection('edits').where('project', '==', pid).onSnapshot(s => { S.edits = s.docs.map(d => ({ id: d.id, ...d.data() })); render(true); }, fail),
    // しおり：bookmarks/<版ID>（持ち主だけが書く。読めない・書けないときは、この端末だけに覚える）
    db.collection('bookmarks').where('project', '==', pid).onSnapshot(s => { S.marks = Object.fromEntries(s.docs.map(d => [d.data().version_id, d.data()])); refreshMarks(); }, () => {}),
  ];
}

async function getVersion(vid) {
  if (!S.vcache[vid]) S.vcache[vid] = S.db.doc('versions/' + vid).get().then(s => s.exists ? s.data() : null);
  return S.vcache[vid];
}
function versions() { return (S.project && S.project.versions) || []; }
function latest() { const v = versions(); return v[v.length - 1]; }
function unconfirmed(vid) { return S.comments.filter(c => c.status !== 'confirmed' && (!vid || c.version_id === vid)); }

let rendering = 0;
async function render(dataOnly) {
  // コメントの変化では、開いている下のシートと画面の数字だけ直す（読んでいる位置を動かさない）
  if (dataOnly && S.view === 'review' && $('[data-b]')) { refreshBadges(); refreshMarks(); refreshSheet(); return; }
  const my = ++rendering;
  if (S.pendingOpen && S.project) { S.pendingOpen = false; S.view = 'review'; S.vid = null; }   // 作品を選んだあと、読み込めたら最新版を開く
  if (!S.project && S.view !== 'projects') S.view = 'projects';
  if (!S.project && !(S.projects || []).length) { main.innerHTML = `<div class="empty">まだ作品が登録されていません。<br>${esc(CONFIG.ai_name)} が台本を登録するまでお待ちください。</div>`; $('#topctl').innerHTML = ''; return; }
  if (S.view === 'review') await reviewView(my);
  else if (S.view === 'fix') fixView();
  else projectsView();
  refreshSheet();
}
function go(view, vid) { S.view = view; if (vid) S.vid = vid; closeSheet(); window.scrollTo(0, 0); render(); }

// ---------------- 作品一覧 ----------------
function projectsView() {
  $('#crumb').textContent = CONFIG.title + '｜作品一覧';
  $('#topctl').innerHTML = '';
  const list = (S.projects || []).slice().sort((a, b) => String(b.key || b.id).localeCompare(String(a.key || a.id)));
  const cards = list.map(p => {
    const vs = p.versions || [], l = vs[vs.length - 1], cur = (p.key || p.id) === PID;
    const extra = cur ? `｜確認がまだのコメント ${unconfirmed().length} 件｜${l && S.approvals[l.id] ? '<span class="status confirmed">最新版は承認済み</span>' : '未承認'}` : '';
    return `<div class="card proj" tabindex="0" role="button" data-p="${esc(p.key || p.id)}">
      <div class="meta">${esc(p.channel)}｜${esc(p.key || p.id)}</div><h3>${esc(p.title)}</h3>
      <div class="meta">最新 ${l ? esc(l.label) : 'なし'}${extra}</div></div>`;
  }).join('');
  main.innerHTML = `${cards}
    <div class="card meta">コメントはこのページ専用の保存場所に入り、${esc(CONFIG.ai_name)} が読みに来ます。
      ${S.owner ? '' : '<br><span class="warn">ページの持ち主としてログインしていないため、確認済み・承認のボタンは出ません。</span>'}</div>`;
  main.querySelectorAll('[data-p]').forEach(el => el.onclick = el.onkeydown = ev => {
    if (ev.type === 'keydown' && ev.key !== 'Enter') return;
    const pid = el.dataset.p;
    if (pid !== PID) { subscribe(pid); S.pendingOpen = true; main.innerHTML = '<div class="empty">読み込み中…</div>'; return; }
    const l = latest(); if (l) go('review', l.id);
  });
}

// ---------------- 台本を読む ----------------
async function reviewView(my) {
  const vs = versions();
  if (!S.vid || !vs.some(x => x.id === S.vid)) S.vid = latest().id;
  const vid = S.vid, idx = vs.findIndex(x => x.id === vid), meta = vs[idx];
  $('#crumb').textContent = `${S.project.channel} › ${S.project.title}`;
  $('#topctl').innerHTML = `<select id="ver" aria-label="版">${vs.map(x => `<option value="${esc(x.id)}" ${x.id === vid ? 'selected' : ''}>${esc(x.label)}${S.approvals[x.id] ? ' ✓承認' : ''}${x.id === latest().id ? '（最新）' : ''}</option>`).join('')}</select>
    <button id="list">コメント一覧</button><button id="fix">修正対応表</button>${S.owner && vid === latest().id ? `<button id="pub" ${draftEdits(vid).length ? '' : 'disabled'}>直しを新しい版に（${draftEdits(vid).length}）</button>` : ''}${S.owner ? '<button id="appr" class="yellow">承認…</button>' : ''}<button id="home">一覧</button>`;
  $('#ver').onchange = e => go('review', e.target.value);
  $('#list').onclick = () => openSheet({ kind: 'list' });
  $('#fix').onclick = () => go('fix');
  if ($('#pub')) $('#pub').onclick = () => openSheet({ kind: 'publish' });
  if ($('#appr')) $('#appr').onclick = () => openSheet({ kind: 'approve' });
  $('#home').onclick = () => go('projects');
  main.innerHTML = '<div class="empty">台本を読み込み中…</div>';
  const [v, prev] = await Promise.all([getVersion(vid), idx > 0 ? getVersion(vs[idx - 1].id) : null]);
  if (my !== rendering) return;
  if (!v) { main.innerHTML = '<div class="empty">この版の本文がまだ登録されていません。</div>'; return; }
  S.version = { ...v, id: vid };
  const prevText = {};
  if (prev) prev.blocks.filter(b => b.k === 'd').forEach(b => prevText[b.id] = b.text);
  const now = new Set(v.blocks.filter(b => b.k === 'd').map(b => b.id));
  const removed = prev ? Object.keys(prevText).filter(k => !now.has(k)) : [];
  const chapters = [...new Set(v.blocks.map(b => b.ch).filter(Boolean))];
  const pend = unconfirmed().length - unconfirmed(vid).length;
  let html = `<div class="meta">${esc(meta.label)}｜台詞 ${v.dialogue_count}・章 ${v.chapter_count}｜${fmt(meta.created_at)}｜登録：${meta.created_by === 'ai' ? esc(CONFIG.ai_name) : '所有者'}
    ${S.approvals[vid] ? '｜<span class="status confirmed">承認済み</span>' : ''}${prev ? `｜前の版から変わった台詞は黄色の枠${removed.length ? `／削除：${esc(removed.join('、'))}` : ''}` : ''}</div>
    ${vid !== latest().id ? `<div class="banner">古い版を見ています。<button id="tolatest">最新（${esc(latest().label)}）へ</button></div>` : ''}
    ${pend > 0 ? `<div class="banner">ほかの版に、確認がまだのコメントが ${pend} 件あります。<button id="tofix">修正対応表で見る</button></div>` : ''}
    <div class="banner resume" id="resume" hidden></div>
    <div class="row"><button id="whole">台本全体へのコメント</button></div>
    <nav class="chips" aria-label="章へ移動">${chapters.map((c, i) => `<button data-ch="${i}">${esc(c)}</button>`).join('')}</nav>`;
  let cur = null;
  for (const b of v.blocks) {
    if (b.ch && b.ch !== cur) { cur = b.ch; const head = b.k === 'c' ? b.raw.trim().split('\n')[0] : cur;
      html += `<div class="chapter" id="ch-${chapters.indexOf(cur)}">${esc(head.length < 30 ? head : cur)}</div>`; }
    if (b.k === 'd') {
      const changed = prev && prevText[b.id] !== b.text;
      const who = spClass(b.sp);
      html += `<div class="card blk ${who} ${changed ? 'changed' : ''}" tabindex="0" role="button" data-b="${esc(b.id)}" aria-label="${esc(b.id)} ${esc(b.sp)}にコメント">
        <div><span class="who">${esc(b.sp || '（話者なし）')}</span><span class="id">${esc(b.id)}${changed ? (prevText[b.id] === undefined ? '・追加' : '・変更') : ''}</span></div>
        ${(b.tags && b.tags.length) || b.note ? `<div class="tags">${esc((b.tags || []).map(t => '【' + t + '】').join(''))} ${esc(b.note)}</div>` : ''}
        <div class="markline">🔖 ここまで読んだ</div>
        ${(() => { const ed = editOf(vid, b.id); return ed ? `<div class="text">${esc(ed.after)}<span class="edtag">直接修正（まだ版にしていない）</span></div><div class="old">${esc(b.text)}</div>` : `<div class="text">${esc(b.text)}</div>`; })()}</div>`;
    } else {
      html += `<div class="card ctxcard"><div class="ctx folded" data-ctx>${esc(b.raw.trim())}</div></div>`;
    }
  }
  main.innerHTML = html;
  main.querySelectorAll('[data-ch]').forEach(el => el.onclick = () => document.getElementById('ch-' + el.dataset.ch).scrollIntoView({ behavior: 'smooth' }));
  main.querySelectorAll('[data-ctx]').forEach(el => el.parentElement.onclick = () => el.classList.toggle('folded'));
  main.querySelectorAll('[data-b]').forEach(el => el.onclick = el.onkeydown = ev => { if (ev.type === 'keydown' && ev.key !== 'Enter') return; openSheet({ kind: 'comment', block: el.dataset.b }); });
  $('#whole').onclick = () => openSheet({ kind: 'comment', block: null });
  if ($('#tofix')) $('#tofix').onclick = () => go('fix');
  if ($('#tolatest')) $('#tolatest').onclick = () => go('review', latest().id);
  document.documentElement.style.setProperty('--hdr', $('#top').offsetHeight + 'px');
  refreshBadges();
  refreshMarks();
  setTimeout(autoMark, 800);
  if (S.focus) { const t = main.querySelector(`[data-b="${CSS.escape(S.focus)}"]`); S.focus = null; t && t.scrollIntoView({ block: 'center' }); }
}

// ---------------- しおり ----------------
// 読み進めると自動で進む：画面の下まで読み切った台詞のうち、いちばん後ろの台詞にしおりを置く（前へ戻すのは手で）。
// 章ボタンで先へ飛んだときは進めない（飛ばした所を読んだことにしない）。
function cards() { return [...main.querySelectorAll('[data-b]')]; }
function markOf(vid) { return S.marks[vid] || store('mark:' + PID + ':' + vid); }
function markIndex(vid) { const m = markOf(vid); if (!m) return -1; return cards().findIndex(el => el.dataset.b === m.block_id); }
let markTimer = null, pendingMark = null;
function setMark(vid, bid, now) {
  const rec = { project: PID, version_id: vid, block_id: bid, at: nowIso(), by: S.owner ? 'owner' : 'viewer' };
  S.marks[vid] = rec; store('mark:' + PID + ':' + vid, rec); refreshMarks();
  pendingMark = rec; clearTimeout(markTimer);
  if (now) flushMark(); else markTimer = setTimeout(flushMark, 4000);
}
async function flushMark() {
  const rec = pendingMark; pendingMark = null; clearTimeout(markTimer);
  if (!rec || !S.owner) return;
  try { await S.db.doc('bookmarks/' + rec.version_id).set(rec); } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushMark(); });
function refreshMarks() {
  if (S.view !== 'review' || !S.vid) return;
  const cs = cards(); if (!cs.length) return;
  const mi = markIndex(S.vid);
  cs.forEach((el, k) => { el.classList.toggle('read', k < mi); el.classList.toggle('mark', k === mi); });
  // 章ボタン：章の台詞を全部読んだら ✓
  main.querySelectorAll('[data-ch]').forEach(btn => {
    const head = document.getElementById('ch-' + btn.dataset.ch); if (!head) return;
    let last = -1; cs.forEach((el, k) => { if (el.compareDocumentPosition(head) & Node.DOCUMENT_POSITION_PRECEDING) { const nh = nextHead(head); if (!nh || (el.compareDocumentPosition(nh) & Node.DOCUMENT_POSITION_FOLLOWING)) last = k; } });
    btn.classList.toggle('done', last >= 0 && last <= mi);
  });
  const r = $('#resume'); if (!r) return;
  if (mi < 0) { r.hidden = true; return; }
  const nxt = cs[mi + 1];
  r.hidden = false;
  r.innerHTML = nxt ? `<span>🔖 ${esc(cs[mi].dataset.b)} まで読みました（${mi + 1} / ${cs.length}）</span><button id="goresume" class="primary">続きから読む（${esc(nxt.dataset.b)} から）</button>`
    : `<span>🔖 最後まで読みました（${cs.length} / ${cs.length}）</span>`;
  if ($('#goresume')) $('#goresume').onclick = () => nxt.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function nextHead(head) { const hs = [...main.querySelectorAll('.chapter')]; return hs[hs.indexOf(head) + 1] || null; }
// 自動で進める：画面に全部見えた台詞を「見た」として覚え、最初から切れ目なく見た所までしおりを進める。
// 章ボタンで先へ飛んだ所や、すばやく通りすぎた所は「見た」にならないので、しおりは飛ばない。
let seen = new Set(), seenVid = null, scrollTimer = null;
window.addEventListener('scroll', () => { if (!scrollTimer) scrollTimer = setTimeout(() => { scrollTimer = null; autoMark(); }, 250); }, { passive: true });
function autoMark() {
  if (S.view !== 'review' || !S.vid || S.sheet) return;
  const cs = cards(); if (!cs.length) return;
  if (seenVid !== S.vid) { seen = new Set(); seenVid = S.vid; }
  const vh = window.innerHeight, top = $('#top').offsetHeight + 50;
  cs.forEach(el => { const r = el.getBoundingClientRect(); if (r.top >= top - 4 && r.bottom <= vh - 4) seen.add(el.dataset.b); });
  const mi = markIndex(S.vid);
  let k = mi; while (k + 1 < cs.length && seen.has(cs[k + 1].dataset.b)) k++;
  if (k > mi) setMark(S.vid, cs[k].dataset.b, false);
}

function refreshBadges() {
  main.querySelectorAll('[data-b]').forEach(el => {
    const n = S.comments.filter(c => c.version_id === S.vid && c.block_id === el.dataset.b && c.status !== 'confirmed').length;
    let bd = el.querySelector('.badge'); if (n && !bd) { bd = document.createElement('span'); bd.className = 'badge'; el.appendChild(bd); }
    if (bd) { if (n) bd.textContent = n; else bd.remove(); }
  });
}

// ---------------- 下から出るシート ----------------
function openSheet(s) { S.sheet = s; refreshSheet(true); }
function closeSheet() { S.sheet = null; $('#sheet').hidden = true; }
function refreshSheet(fresh) {
  const sh = $('#sheet');
  if (!S.sheet) { sh.hidden = true; return; }
  // 入力中は描き直さない（打った文字を消さない）
  if (!fresh && sh.contains(document.activeElement) && /TEXTAREA|INPUT/.test(document.activeElement.tagName)) return;
  ({ comment: commentSheet, list: listSheet, approve: approveSheet, publish: publishSheet })[S.sheet.kind]();
  sh.hidden = false;
}

function commentCard(c, withBlock) {
  const hist = (c.history || []).filter(h => h.note);
  return `<div class="card"><span class="status ${c.status}">${STATUS[c.status] || esc(c.status)}</span>
    <span class="meta">${withBlock ? esc(c.block_id || '全体') + '｜' : ''}${esc(labelOf(c.version_id))}｜${fmt(c.created_at)}</span>
    <div>${esc(c.body)}</div>
    ${hist.map(h => `<div class="hist">${fmt(h.at)} ${h.to === 'open' ? '再修正：' : ''}${esc(h.note)}</div>`).join('')}
    ${ownerControls(c)}</div>`;
}
function ownerControls(c) {
  return S.owner ? `<div class="row">${c.status !== 'confirmed' ? `<button data-conf="${esc(c.id)}">確認済みにする</button>` : ''}${c.status !== 'open' ? `<button data-reo="${esc(c.id)}">再修正を頼む</button>` : ''}</div>
    <div class="ask" data-reobox="${esc(c.id)}" hidden><label class="meta" for="rn-${esc(c.id)}">再修正の内容（任意）</label>
      <textarea id="rn-${esc(c.id)}" style="min-height:70px"></textarea><div class="row"><button class="primary" data-reogo="${esc(c.id)}">未解決に戻す</button><button data-reono="${esc(c.id)}">やめる</button></div></div>` : '';
}
function labelOf(vid) { const v = versions().find(x => x.id === vid); return v ? v.label : '?'; }

function wireOwnerButtons(root) {
  root.querySelectorAll('[data-conf]').forEach(el => el.onclick = () => setStatus(el.dataset.conf, 'confirmed', null));
  root.querySelectorAll('[data-reo]').forEach(el => el.onclick = () => { const box = root.querySelector(`[data-reobox="${CSS.escape(el.dataset.reo)}"]`); box.hidden = false; box.querySelector('textarea').focus(); });
  root.querySelectorAll('[data-reono]').forEach(el => el.onclick = () => root.querySelector(`[data-reobox="${CSS.escape(el.dataset.reono)}"]`).hidden = true);
  root.querySelectorAll('[data-reogo]').forEach(el => el.onclick = () => setStatus(el.dataset.reogo, 'open', $('#rn-' + CSS.escape(el.dataset.reogo)).value.trim() || null));
}
async function setStatus(id, to, note) {
  if (!S.owner) return;
  const c = S.comments.find(x => x.id === id); if (!c) return;
  const history = [...(c.history || []), { at: nowIso(), by: 'owner', from: c.status, to, note }];
  try { await S.db.doc('comments/' + id).update({ status: to, updated_at: nowIso(), revision: (c.revision || 1) + 1, history });
    toast(to === 'confirmed' ? '確認済みにしました' : '未解決に戻しました'); }
  catch (e) { toast(errMsg(e)); }
}

function commentSheet() {
  const v = S.version, blockId = S.sheet.block, sh = $('#sheet');
  const b = blockId ? v.blocks.find(x => x.id === blockId) : null;
  const key = `draft:${PID}:${S.vid}:${blockId || '_whole'}`;
  let draft = store(key) || { body: '', cid: rid(), state: 'draft' };
  const mine = S.comments.filter(c => c.version_id === S.vid && (c.block_id || null) === blockId).sort((a, b) => a.created_at < b.created_at ? -1 : 1);
  sh.innerHTML = `<div class="row" style="justify-content:space-between"><strong>${blockId ? 'この台詞にコメント' : '台本全体へのコメント'}</strong><button id="close">閉じる</button></div>
    <div class="target">対象：${esc(S.project.title)}｜${esc(labelOf(S.vid))}｜${blockId ? esc(blockId) + ' ' + esc(b.sp) : '全体'}</div>
    ${b ? `<p style="margin:6px 0">${esc(b.text)}</p>` : ''}
    ${mine.map(c => commentCard(c, false)).join('')}
    <label for="cbody" class="meta">新しいコメント（${esc(CONFIG.ai_name)} に直してもらう）</label>
    <textarea id="cbody" placeholder="気になった所を書いてください">${esc(draft.body)}</textarea>
    <div class="row" style="justify-content:space-between"><span id="sv" class="save"></span><button id="send" class="primary">送信</button></div>
    ${S.owner && b && S.vid === latest().id ? `<hr style="border:none;border-top:1px solid var(--line);margin:14px 0">
    <label for="ebody" class="meta">文章を直す（自分で書き直す）${editOf(S.vid, blockId) ? '｜<span class="edtag">直接修正あり</span>' : ''}</label>
    <textarea id="ebody">${esc((editOf(S.vid, blockId) || {}).after ?? b.text)}</textarea>
    <div class="row" style="justify-content:space-between"><span class="meta">保存すると、版にするまで「まだ版にしていない直し」として残ります</span>
      <span>${editOf(S.vid, blockId) ? '<button id="eundo">直しを取り消す</button>' : ''}<button id="esave" class="primary">直しを保存</button></span></div>` : ''}`;
  const sv = $('#sv'), ta = $('#cbody');
  const show = () => { sv.className = 'save ' + draft.state; sv.textContent = { draft: draft.body ? 'この端末に下書き' : '', unsent: '未送信（もう一度「送信」を押してください）', saved: '保存しました' }[draft.state] || ''; };
  show();
  let h;
  ta.oninput = () => { clearTimeout(h); h = setTimeout(() => { if (draft.state === 'saved') draft = { body: '', cid: rid(), state: 'draft' }; draft.body = ta.value; if (draft.state !== 'unsent') draft.state = 'draft'; store(key, draft); show(); }, 300); };
  $('#close').onclick = closeSheet;
  $('#send').onclick = async () => {
    clearTimeout(h); draft.body = ta.value; if (!draft.body.trim()) { toast('本文が空です'); return; }
    store(key, draft);
    const btn = $('#send'); btn.disabled = true;
    try {
      // 送信前に決めたIDで保存：押し直しても同じ1件
      await S.db.doc('comments/' + draft.cid).set({ project: PID, version_id: S.vid, block_id: blockId, block_text: b ? b.text : null,
        body: draft.body, status: 'open', by: 'owner', created_at: nowIso(), updated_at: nowIso(), revision: 1, history: [] });
      store(key, null); draft = { body: '', cid: rid(), state: 'saved' };
      toast('保存しました'); refreshSheet(true);
    } catch (e) {
      draft.state = 'unsent'; store(key, draft); show(); toast(errMsg(e)); btn.disabled = false;
    }
  };
  if ($('#esave')) $('#esave').onclick = async () => {
    const after = $('#ebody').value.replace(/\r/g, '').trim();
    if (!after) { toast('文章が空です'); return; }
    if (after === b.text) { toast('元の文章と同じです'); return; }
    const btn = $('#esave'); btn.disabled = true;
    try {
      await S.db.doc('edits/' + editId(S.vid, blockId)).set({ project: PID, version_id: S.vid, block_id: blockId, speaker: b.sp || '',
        before: b.text, after, status: 'draft', by: 'owner', at: nowIso() });
      toast('直しを保存しました'); refreshSheet(true);
    } catch (e) { toast(errMsg(e)); btn.disabled = false; }
  };
  if ($('#eundo')) $('#eundo').onclick = async () => {
    try { await S.db.doc('edits/' + editId(S.vid, blockId)).delete(); toast('直しを取り消しました'); refreshSheet(true); }
    catch (e) { toast(errMsg(e)); }
  };
  if (blockId) {
    const mk = document.createElement('div'); mk.className = 'row'; mk.style.marginTop = '10px';
    mk.innerHTML = '<button id="markhere">🔖 しおりをこの台詞に</button>';
    sh.insertBefore(mk, sh.children[2] || null);
    $('#markhere').onclick = () => { seen = new Set(); setMark(S.vid, blockId, true); closeSheet(); };
  }
  wireOwnerButtons(sh);
}

// ---------------- 直接修正 ----------------
function editId(vid, bid) { return vid + '__' + bid; }
function editOf(vid, bid) { return S.edits.find(e => e.version_id === vid && e.block_id === bid && e.status === 'draft'); }
function draftEdits(vid) { return S.edits.filter(e => e.version_id === vid && e.status === 'draft'); }
function nextLabel(label) {
  const m = /^v(\d+)\.(\d+)$/.exec(label || '');
  return m ? `v${m[1]}.${Number(m[2]) + 1}` : `${label || 'v'}+1`;
}
function publishSheet() {
  const sh = $('#sheet'), vid = latest().id, eds = draftEdits(vid);
  const order = Object.fromEntries((S.version ? S.version.blocks : []).map(x => [x.id, x.i]));
  eds.sort((a, c) => (order[a.block_id] ?? 0) - (order[c.block_id] ?? 0));
  const label = nextLabel(latest().label);
  sh.innerHTML = `<div class="row" style="justify-content:space-between"><strong>直しを新しい版にする</strong><button id="close">閉じる</button></div>
    <div class="target">${esc(S.project.title)}｜${esc(latest().label)} → <strong>${esc(label)}</strong>（前の版はそのまま残ります）</div>
    ${eds.map(e => `<div class="card"><div class="meta">${esc(e.block_id)} ${esc(e.speaker)}</div><div class="old">${esc(e.before)}</div><div>${esc(e.after)}</div></div>`).join('') || '<div class="empty">直しはありません</div>'}
    <label for="pnote" class="meta">この版のメモ（任意）</label><textarea id="pnote" style="min-height:60px"></textarea>
    <div class="row" style="justify-content:flex-end"><button id="pgo" class="primary" ${eds.length ? '' : 'disabled'}>${esc(label)} を作る</button></div>`;
  $('#close').onclick = closeSheet;
  $('#pgo').onclick = async () => {
    const btn = $('#pgo'); btn.disabled = true;
    try {
      const base = await getVersion(vid);
      const vs = versions(), last = vs[vs.length - 1];
      const newId = PID + '-' + label.replace(/\./g, '_');
      if (vs.some(x => x.id === newId)) { toast('同じ名前の版がもうあります'); btn.disabled = false; return; }
      const map = Object.fromEntries(eds.map(e => [e.block_id, e.after]));
      const blocks = base.blocks.map(x => x.k === 'd' && map[x.id] !== undefined ? { ...x, text: map[x.id], edited_by_owner: true } : x);
      const at = nowIso();
      await S.db.doc('versions/' + newId).set({ project: PID, number: (last.number || vs.length) + 1, label, based_on: vid, created_at: at, created_by: 'owner',
        dialogue_count: base.dialogue_count, chapter_count: base.chapter_count, blocks,
        change_note: CONFIG.owner_name + 'の直接修正 ' + eds.length + ' 件：' + eds.map(e => e.block_id).join('、') + (($('#pnote').value || '').trim() ? '｜' + $('#pnote').value.trim() : ''),
        file: null, sha256: null });
      await S.db.doc('projects/' + PID).update({ versions: [...vs, { id: newId, number: (last.number || vs.length) + 1, label, created_at: at, created_by: 'owner' }] });
      for (const e of eds) await S.db.doc('edits/' + e.id).update({ status: 'applied', target_version_id: newId, applied_at: at });
      toast(label + ' を作りました'); closeSheet(); go('review', newId);
    } catch (e) { toast(errMsg(e)); btn.disabled = false; }
  };
}

function listSheet() {
  const sh = $('#sheet');
  const prevState = { st: $('#fst') ? $('#fst').value : 'notconfirmed', ord: $('#ford') ? $('#ford').value : 'script', q: $('#fq') ? $('#fq').value : '', all: $('#fall') ? $('#fall').checked : false };
  sh.innerHTML = `<div class="row" style="justify-content:space-between"><strong>コメント一覧</strong><button id="close">閉じる</button></div>
    <div class="filter"><select id="fst" aria-label="状態"><option value="notconfirmed">確認がまだ</option><option value="open">未解決</option><option value="proposed">修正案提出</option><option value="confirmed">確認済み</option><option value="all">すべて</option></select>
    <select id="ford" aria-label="並び"><option value="script">台本の順</option><option value="new">新しい順</option></select>
    <label class="meta"><input type="checkbox" id="fall"> ほかの版も</label>
    <input id="fq" type="search" placeholder="検索" aria-label="検索" style="flex:1;min-width:120px"></div><div id="clist"></div>`;
  $('#fst').value = prevState.st; $('#ford').value = prevState.ord; $('#fq').value = prevState.q; $('#fall').checked = prevState.all;
  const draw = () => {
    const st = $('#fst').value, q = $('#fq').value, ord = $('#ford').value, all = $('#fall').checked;
    const order = Object.fromEntries((S.version ? S.version.blocks : []).map(b => [b.id, b.i]));
    let cs = S.comments.filter(c => (all || c.version_id === S.vid) && (st === 'all' || (st === 'notconfirmed' ? c.status !== 'confirmed' : c.status === st)) && (!q || c.body.includes(q)));
    cs.sort((a, b) => ord === 'new' ? (a.created_at < b.created_at ? 1 : -1) : (order[a.block_id] ?? -1) - (order[b.block_id] ?? -1));
    $('#clist').innerHTML = `<div class="meta">${cs.length} 件</div>` + (cs.map(c => `<div data-go="${esc(c.block_id || '')}" data-gv="${esc(c.version_id)}">${commentCard(c, true)}</div>`).join('') || '<div class="empty">ありません</div>');
    $('#clist').querySelectorAll('[data-go] > .card > div:not(.row):not(.ask)').forEach(el => el.onclick = () => {
      const w = el.closest('[data-go]'); if (!w.dataset.go) return;
      if (w.dataset.gv !== S.vid) { S.focus = w.dataset.go; go('review', w.dataset.gv); return; }
      closeSheet(); const t = main.querySelector(`[data-b="${CSS.escape(w.dataset.go)}"]`); t && t.scrollIntoView({ behavior: 'smooth', block: 'center' }); });
    wireOwnerButtons($('#clist'));
  };
  $('#close').onclick = closeSheet;
  ['#fst', '#ford', '#fq', '#fall'].forEach(s => $(s).oninput = draw);
  draw();
}

function approveSheet() {
  const sh = $('#sheet'), vid = S.vid, n = unconfirmed().length, done = S.approvals[vid];
  sh.innerHTML = `<strong>最終承認</strong><div class="target">${esc(S.project.title)}｜${esc(labelOf(vid))}</div>
    ${done ? `<p><span class="status confirmed">承認済み</span> ${fmt(done.at)}</p><div class="row"><button id="close">閉じる</button></div>` : `
    <p>この作品で、確認がまだのコメント：<strong>${n} 件</strong>（ほかの版のものもふくむ）</p>

    <p class="meta">承認はこの版だけ。新しい版ができても、承認は引き継ぎません。</p>
    <div class="row"><button id="ok" class="yellow">承認する</button><button id="close">やめる</button></div>`}`;

      toast('承認しました'); closeSheet(); render(); } catch (e) { toast(errMsg(e)); }
  };
}

// ---------------- 修正対応表 ----------------
function fixView() {
  $('#crumb').textContent = `${S.project.channel} › ${S.project.title} › 修正対応表`;
  $('#topctl').innerHTML = `<button id="back">台本へ</button>`;
  $('#back').onclick = () => go('review', latest().id);
  const byId = Object.fromEntries(S.comments.map(c => [c.id, c]));
  const reps = S.reports.slice().sort((a, b) => a.created_at < b.created_at ? 1 : -1);
  const listed = new Set(reps.flatMap(r => (r.items || []).map(it => it.comment_id)));
  const loose = unconfirmed().filter(c => !listed.has(c.id));
  main.innerHTML = (reps.length ? reps.map(r => `<div class="card"><strong>${esc(labelOf(r.source_version_id))} → ${esc(labelOf(r.target_version_id))}</strong>
    <span class="meta">${fmt(r.created_at)}｜提出：${r.created_by === 'ai' ? esc(CONFIG.ai_name) : '所有者'}</span>
    ${r.summary ? `<div class="meta">${esc(r.summary)}</div>` : ''}
    ${(r.items || []).map(it => { const c = byId[it.comment_id] || {}; return `<div class="fixitem">
      <div class="lbl">指摘｜${esc(c.block_id || '全体')}（${esc(labelOf(c.version_id))}）</div><div>${esc(c.body || '（コメントが見つかりません）')}</div>
      <div class="lbl" style="margin-top:6px">${esc(CONFIG.ai_name)} の対応｜<strong>${ACT[it.action] || esc(it.action)}</strong>${it.target_block_id ? ` → ${esc(labelOf(r.target_version_id))} ${esc(it.target_block_id)}` : ''}</div>
      ${it.before ? `<div class="lbl">前：</div><div>${esc(it.before)}</div>` : ''}${it.after ? `<div class="lbl">後：</div><div>${esc(it.after)}</div>` : ''}
      <div>${esc(it.explanation)}</div>
      ${it.changed_since_read ? '<div class="warn">修正中にコメントが変わった（追加確認が必要）</div>' : ''}
      <div class="row"><span class="status ${c.status}">${STATUS[c.status] || ''}</span>
      ${it.target_block_id ? `<button data-see="${esc(r.target_version_id)}|${esc(it.target_block_id)}">新しい版で見る</button>` : ''}</div>
      ${c.id ? ownerControls(c) : ''}</div>`; }).join('')}
    </div>`).join('') : '<div class="empty">まだ修正対応表はありません。</div>')
    + (loose.length ? `<div class="card"><strong>対応表にまだ入っていない、確認がまだのコメント（${loose.length} 件）</strong>${loose.map(c => commentCard(c, true)).join('')}</div>` : '');
  main.querySelectorAll('[data-see]').forEach(el => el.onclick = () => { const [v, b] = el.dataset.see.split('|'); S.focus = b; go('review', v); });
  wireOwnerButtons(main);
}
</script>

</body></html>
